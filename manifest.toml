#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "meshyface"
name = "Meshyface"
description.en = "Chat-first web dashboard for a Meshtastic mesh radio, with map, topology and history"
description.fr = "Tableau de bord web axé chat pour un radio maillé Meshtastic, avec carte, topologie et historique"

version = "0.1.0~ynh1"

maintainers = ["crazypedia"]

[upstream]
license = "GPL-3.0-only"
code = "https://github.com/crazypedia/meshyface"
userdoc = "https://github.com/crazypedia/meshyface/blob/main/README.md"
admindoc = "https://github.com/crazypedia/meshyface/blob/main/docs/maintenance.md"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

# Meshyface has no login page or user database of its own: access is gated
# purely by the YunoHost permission chosen below, not by app-level auth
# that could integrate with LDAP or SSO.
ldap = "not_relevant"
sso = "not_relevant"

disk = "400M"
ram.build = "200M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"
    # Meshyface's single-page UI hardcodes root-relative asset/API paths
    # (no --base-path style option upstream), so it can only be installed
    # at the domain root, not under a subpath.
    full_domain = true

    [install.init_main_permission]
    type = "group"
    # Chat, node locations and history are visible to anyone with access;
    # default to signed-in users rather than the public internet.
    default = "all_users"

    [install.mesh_transport]
    ask.en = "How is the Meshtastic radio reachable?"
    ask.fr = "Comment le radio Meshtastic est-il joignable ?"
    type = "select"
    choices = ["tcp", "serial"]
    default = "tcp"
    help.en = "'tcp' for a radio reachable over Wi-Fi/Ethernet (recommended for a VM/LXC host, usual port 4403). 'serial' for a radio plugged into this host over USB."
    help.fr = "« tcp » pour un radio joignable via Wi-Fi/Ethernet (recommandé pour un hôte VM/LXC, port habituel 4403). « serial » pour un radio branché en USB sur cet hôte."

    [install.mesh_host]
    ask.en = "Meshtastic radio host or IP (TCP mode)"
    ask.fr = "Hôte ou IP du radio Meshtastic (mode TCP)"
    type = "string"
    default = ""
    optional = true
    example = "192.168.1.42"
    help.en = "Only used when the transport above is 'tcp'. Leave empty for serial mode."
    help.fr = "Utilisé uniquement si le mode de connexion ci-dessus est « tcp ». Laisser vide en mode série."

    [install.mesh_tcp_port]
    ask.en = "Meshtastic radio TCP port"
    ask.fr = "Port TCP du radio Meshtastic"
    type = "number"
    default = 4403

    [install.mesh_serial_path]
    ask.en = "Meshtastic radio serial device path (serial mode)"
    ask.fr = "Chemin du périphérique série du radio Meshtastic (mode série)"
    type = "string"
    default = "/dev/ttyACM0"
    help.en = "Only used when the transport above is 'serial'. Prefer a stable /dev/serial/by-id/... path over /dev/ttyACM0 if this host may have other USB serial devices."
    help.fr = "Utilisé uniquement en mode série. Préférez un chemin stable /dev/serial/by-id/... plutôt que /dev/ttyACM0 si cet hôte peut avoir d'autres périphériques série USB."

    [install.private_mode]
    ask.en = "Restrict public chat/message API surfaces?"
    ask.fr = "Restreindre les API de chat/messages publics ?"
    type = "boolean"
    default = false
    help.en = "Hides public chat slices and blocks some public endpoints, independently of the YunoHost permission above. Useful for more sensitive deployments."
    help.fr = "Masque les portions de chat publiques et bloque certains points d'accès publics, indépendamment de la permission YunoHost ci-dessus."

    [install.api_token]
    ask.en = "API token for write endpoints (optional)"
    ask.fr = "Jeton d'API pour les points d'écriture (optionnel)"
    type = "password"
    optional = true
    help.en = "If set, write endpoints (chat, settings changes, ...) require this token via 'Authorization: Bearer' or 'X-API-Token'. Leave empty to rely only on the YunoHost permission above."
    help.fr = "Si renseigné, les points d'écriture (chat, changements de réglages, ...) exigent ce jeton via « Authorization: Bearer » ou « X-API-Token ». Laisser vide pour ne se reposer que sur la permission YunoHost ci-dessus."

    [install.bbs_enable]
    ask.en = "Enable the BBS/profile workspace?"
    ask.fr = "Activer l'espace BBS/profil ?"
    type = "boolean"
    default = false
    help.en = "BBS and file transfer can consume significant mesh airtime. Enabling this also acknowledges that tradeoff on Meshyface's behalf (equivalent to --accept-file-transfer-traffic-disclaimer)."
    help.fr = "Le BBS et le transfert de fichiers peuvent consommer beaucoup de temps d'antenne mesh. Activer cette option équivaut aussi à accepter ce compromis pour Meshyface (--accept-file-transfer-traffic-disclaimer)."

    [install.games_enable]
    ask.en = "Enable the playable Zork console and mesh bot?"
    ask.fr = "Activer la console Zork jouable et le bot mesh ?"
    type = "boolean"
    default = false

[resources]
    [resources.sources.main]
    # Pinned to a commit on the crazypedia/meshyface main branch: upstream
    # has not cut a tagged release yet. Re-pin to a tag once one exists.
    url = "https://github.com/crazypedia/meshyface/archive/526fc3a228f64dea3800b88f5c8140fee8c50023.tar.gz"
    sha256 = "56f7c01b57ad1dcf146b027733c0cc36535a04a45e38967de49a34bbf147ae26"

    [resources.system_user]
    # install/upgrade/restore chown files to $app:$app and the systemd unit
    # runs as $app, so this resource is required.

    [resources.install_dir]
    # /var/www/$app -> $install_dir; holds the source checkout and venv.

    [resources.data_dir]
    # /home/yunohost.app/$app -> $data_dir; holds the SQLite history DB and
    # theme settings JSON. Not world/www-data readable; only $app can read it.

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    # Internal port meshdash's HTTP server binds to on 127.0.0.1; nginx
    # reverse-proxies to it. Not meant to be exposed externally.

    [resources.apt]
    packages = "python3, python3-venv"
