#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]

    # mesh_transport defaults to "tcp" with an empty mesh_host, so CI
    # installs come up in meshdash's offline/connecting mode without a
    # reachable radio (it keeps retrying instead of crashing). No custom
    # args are needed to make install/backup_restore/upgrade tests pass.
